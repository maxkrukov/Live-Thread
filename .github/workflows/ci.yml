name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff

      - name: Lint Python with ruff
        run: ruff check live_thread tests

      - name: Run unit tests
        run: pytest -v

      - name: Validate shell installer and frontend JS
        run: |
          bash -n scripts/install.sh
          node --check live_thread/web/markdown.js
          node --check live_thread/web/app.js
          node --check live_thread/web/i18n.js
          node --test tests/test_markdown.mjs
