[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "live-thread"
dynamic = ["version"]
description = "Live topic thread with short notes for any conversation: speech recognition + any OpenAI-compatible LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["transcription", "whisper", "llm", "notes", "diarization", "live", "pipewire"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "numpy>=1.24",
    "faster-whisper>=1.0",
]

[project.optional-dependencies]
diarization = [
    "sherpa-onnx>=1.10",
]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/maxkrukov/Live-Thread"
Repository = "https://github.com/maxkrukov/Live-Thread"
Issues = "https://github.com/maxkrukov/Live-Thread/issues"

[project.scripts]
live-thread = "live_thread.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "live_thread.__version__"}

[tool.setuptools.packages.find]
include = ["live_thread*"]

[tool.setuptools.package-data]
live_thread = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
